name: dog_food
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.1
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  mpesa_flutter_plugin:
  http: ^1.3.0
  googleapis: ^14.0.0
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.0+1
  flutter_paypal_payment: ^1.0.8
  flutter_paypal: ^0.2.1
  intl: ^0.17.0
  webview_flutter: ^4.9.0
  webview_flutter_android: ^3.16.9
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/assets/images/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/Noto_Sans/NotoSans-Regular.ttf
        # - asset: assets/fonts/Noto_Sans/NotoSans-Bold.ttf
        #   weight: 700
        # - asset: assets/fonts/Noto_Sans/NotoSans-Italic.ttf
        #   style: italic
